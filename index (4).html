<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Monitoring Toko · Area Hasan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#0b1220;--card:#121a2e;--c2:#18223a;--line:#25324f;--ink:#e6edf7;--mut:#8b9ab5;--cy:#22d3ee;--vi:#8b5cf6;--pk:#ec4899;--g:#34d399;--r:#fb7185;--y:#fbbf24;--b:#60a5fa}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 0 -10%,rgba(139,92,246,.25),transparent),radial-gradient(800px 500px at 100% 0,rgba(34,211,238,.15),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:14px;min-height:100vh}
.bar{max-width:1560px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(18,26,46,.9);border:1px solid var(--line);padding:10px 14px;border-radius:14px;position:sticky;top:8px;z-index:5;backdrop-filter:blur(8px)}
.brand{font-weight:800;font-size:16px;margin-right:auto;background:linear-gradient(90deg,var(--cy),var(--vi),var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:4px;background:var(--c2);padding:4px;border-radius:10px}
.tabs button{background:none;border:0;color:var(--mut);font:inherit;font-weight:700;font-size:13px;padding:7px 13px;border-radius:8px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--vi),var(--pk));color:#fff}
select,.bt{font:inherit;font-size:13px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--c2);color:var(--ink)}
.bt{cursor:pointer;font-weight:700}.bt.p{background:linear-gradient(135deg,var(--cy),var(--vi));border:0;color:#04101f}
.live{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--g);animation:p 1.6s infinite}.dot.e{background:var(--r);animation:none}
@keyframes p{50%{opacity:.3}}
#cap{max-width:1560px;margin:0 auto;padding:6px;background:var(--bg)}
.card{background:linear-gradient(180deg,var(--card),var(--c2));border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.top{display:grid;grid-template-columns:190px 1fr 250px;gap:12px}
.c{text-align:center}.big{font-size:32px;font-weight:800;color:var(--cy)}.sm{font-size:12px;color:var(--mut)}
h1{margin:2px 0 8px;font-size:24px;letter-spacing:.3px}
.pill{display:inline-block;background:linear-gradient(135deg,var(--vi),var(--pk));font-weight:800;font-size:12px;padding:6px 16px;border-radius:99px}
.leg div{font-size:13px;margin:5px 0;font-weight:600}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.kpis{display:grid;gap:12px;margin:12px 0}
.k6{grid-template-columns:repeat(6,1fr)}.k4{grid-template-columns:repeat(4,1fr)}
.kpi{text-align:center;position:relative;overflow:hidden}
.kpi h4{margin:0;font-size:12px;color:var(--mut);letter-spacing:.6px}
.kpi .v{font-size:25px;font-weight:800;margin:4px 0}
.bg{height:5px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}.bg span{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--vi))}
.tw{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1100px}
th{background:var(--c2);color:var(--mut);text-align:center;padding:10px 6px;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
th.k{background:#7f1d33;color:#fff}
td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;vertical-align:middle}
tbody tr:hover{background:rgba(139,92,246,.1)}
td.l{text-align:left}
.no{font-weight:800;font-size:16px;color:var(--mut)}tr:first-child .no{color:var(--y)}
.nm b{font-size:14px}.nm div,.ps{font-size:11px;color:var(--mut)}.ps{text-align:left}
.t{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.rk{font-weight:800;color:var(--pk)}
.v1{font-weight:800;font-size:14px;color:var(--r)}.v1.ok{color:var(--g)}.v1 small{display:block;font-weight:500;font-size:10px;color:var(--mut)}
.min{background:var(--r);border-radius:8px;padding:6px 4px;color:#2a0510}.min small{color:#4a0a1a!important}
.tt{font-weight:800;font-size:16px;color:var(--cy)}
.st{display:inline-block;font-weight:800;font-size:11px;padding:7px 10px;border-radius:99px;line-height:1.15}
.s0{background:rgba(52,211,153,.18);color:var(--g)}.s1{background:rgba(96,165,250,.18);color:var(--b)}.s2{background:rgba(251,191,36,.18);color:var(--y)}.s3{background:rgba(251,113,133,.18);color:var(--r)}
.kr{font-weight:800;color:var(--r)}.kr.z{color:var(--g)}.kr.mx{background:#9b1c3a;color:#fff;border-radius:8px;padding:6px 4px}.kr.mx small{display:block;font-size:8px}
.bot{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px;margin-top:12px}
.bot h3,.sec{margin:0 0 8px;font-size:15px}.bot p{margin:4px 0;font-size:13px;color:#cbd5e6}
.kes{border-color:var(--y)}
.grad{color:#fff;border-radius:16px;padding:16px;text-align:center;position:relative;overflow:hidden}
.grad .v{font-size:30px;font-weight:800}.grad .sm{color:rgba(255,255,255,.85)}
.gm{background:linear-gradient(135deg,#b06ab3,#ff8fb1)}.gk{background:linear-gradient(135deg,#22d3ee,#3b82f6)}.gc{background:linear-gradient(135deg,#34d399,#10b981)}.gd{background:linear-gradient(135deg,#7c3aed,#d946ef)}
.pc{font-weight:800}.pc small{display:block;font-weight:500;font-size:10px;color:var(--mut)}
.b5{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.b5 .tag{display:inline-block;color:#fff;font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px;margin-bottom:8px}
.b5 .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.b5 .row b{color:var(--r)}
.hist{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-start}
.hb{width:21px;text-align:center;font-size:10px;font-weight:700;padding:3px 0;border-radius:4px;color:#06101f}
.hb.n{background:var(--line);color:var(--mut)}
.ft{text-align:center;color:var(--mut);font-size:12px;margin-top:14px}
#msg{max-width:1560px;margin:30px auto;text-align:center;color:var(--mut)}
@media(max-width:950px){.top,.bot,.b5,.k4{grid-template-columns:1fr 1fr}.top{grid-template-columns:1fr}.k6{grid-template-columns:repeat(2,1fr)}.bot{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">◆ MONITORING TOKO · AREA HASAN</span>
  <div class="tabs" id="tabs">
    <button data-t="prod" class="on">📈 Produktivitas</button>
    <button data-t="mem">🎁 Member &amp; Fair</button>
    <button data-t="acc">🗓 Akumulasi Bulan</button>
  </div>
  <select id="tgl"></select>
  <select id="jam"></select>
  <button class="bt" onclick="refresh()">⟳ Refresh</button>
  <button class="bt p" onclick="dl()">⬇ Download Gambar</button>
  <a class="bt" id="xls" target="_blank" style="text-decoration:none">📄 Spreadsheet</a>
  <label class="live"><span class="dot" id="dot"></span><span id="upd">memuat…</span></label>
</div>
<div id="msg">Memuat data dari Google Sheets…</div>
<div id="cap" style="display:none"></div>

<script>
/* ============ PENGATURAN ============ */
const SHEET_ID='1ylxNHZGFvu2-AE_62H9qBPFuVa6CJHpTw6pfot2AaY8';
const REFRESH_DETIK=30;
const BLOCK=[7,32,57,82], JAMS=['10:00','15:00','19:00','23:00'], N=19;
const TARGET={psm:150,sertis:30,pwp:50,seger:50,ceban:10}, TOTAL_T=290;
const IND=[['psm','PSM','Qty'],['sertis','SERTIS','Pkt'],['pwp','PWP','Qty'],['seger','SEGER','Qty'],['ceban','CEBAN','Pkt']];
const STATUS=[[.9,'SANGAT<br>PRODUKTIF','s0'],[.7,'PRODUKTIF','s1'],[.5,'KURANG<br>PRODUKTIF','s2'],[0,'TIDAK PRODUKTIF','s3']];
const TIER=[[12,'Tinggi','#34d399'],[16,'Menengah','#fbbf24'],[99,'Terkecil','#fb7185']];
// Fair: kolom fokus mkt 1-3 di sheet (R=redeem, L=lost). Ubah label bila urutannya berbeda.
const FAIRS=[['f1','KOKING FAIR','gk','#3b82f6'],['f2','CASHBACK PC','gc','#10b981'],['f3','DIAPERS FAIR','gd','#d946ef']];
const COLS={psm:6,sertis:7,pwp:8,seger:9,ceban:10,pakai:11,tidak:12,nmA:15,f1R:17,f1L:18,f2R:20,f2L:21,f3R:23,f3L:24};

const $=id=>document.getElementById(id), pad=n=>('0'+n).slice(-2);
const f1=x=>(Math.round(x*10)/10).toString();
let DATA=null, TAB='prod', MONTH=null, CACHE={};
$('xls').href='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit';

(function(){
  const t=$('tgl');for(let d=1;d<=31;d++)t.add(new Option('Tanggal '+pad(d),d));
  const j=$('jam');j.add(new Option('Total Harian',-1));JAMS.forEach((x,i)=>j.add(new Option('Jam '+x,i)));
  t.value=parseInt(new Date().toLocaleString('en-US',{day:'numeric',timeZone:'Asia/Jakarta'}),10);t.dataset.auto='1';
  t.onchange=()=>{t.dataset.auto='0';load()};j.onchange=render;
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');TAB=b.dataset.t;
    $('jam').style.display=TAB==='acc'?'none':'';$('tgl').style.display=TAB==='acc'?'none':'';
    if(TAB==='acc'&&!MONTH)loadMonth();else render()});
})();

/* ============ DATA ============ */
function csv(t){const R=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
  if(c||r.length){r.push(c);R.push(r)}return R}
const num=x=>{if(x==null||x==='')return 0;const n=Number(String(x).replace(',','.'));return isNaN(n)?(parseFloat(String(x).replace(/[^\d.\-]/g,''))||0):n};
async function fetchDay(d,fresh){
  if(!fresh&&CACHE[d])return CACHE[d];
  const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Tgl_${pad(d)}&range=A1:AO100&_=${Date.now()}`;
  const res=await fetch(u);if(!res.ok)throw new Error('HTTP '+res.status);
  const rows=csv(await res.text());if(rows.length<20)throw new Error('Sheet kosong / tidak ditemukan');
  return CACHE[d]=parse(rows);
}
function parse(rows){
  const cell=(r,c)=>(rows[r]&&rows[r][c]!=null)?rows[r][c]:'';
  const stores=[];let any=false;
  for(let i=0;i<N;i++){
    const s={kode:String(cell(BLOCK[0]-1+i,1)).trim(),nama:String(cell(BLOCK[0]-1+i,2)).trim(),h:[]};
    for(let b=0;b<4;b++){const r=BLOCK[b]-1+i;const h={lapor:false,staff:String(cell(r,4)).trim(),crew:String(cell(r,5)).trim()};
      for(let c=6;c<=12;c++)if(cell(r,c)!=='')h.lapor=true;
      for(const k in COLS)h[k]=num(cell(r,COLS[k]));
      if(IND.some(x=>h[x[0]]>0))any=true;s.h.push(h)}
    stores.push(s)}
  return{stores,any};
}
function agg(p,jam){
  return p.stores.map(s=>{const o={kode:s.kode,nama:s.nama,staff:'',crew:''};
    for(const k in COLS)o[k]=0;
    s.h.forEach((h,b)=>{if(jam===-1||jam===b){for(const k in COLS)o[k]+=h[k];if(h.staff)o.staff=h.staff;if(h.crew)o.crew=h.crew}});
    o.total=IND.reduce((a,x)=>a+o[x[0]],0);return o}).filter(o=>o.nama||o.kode);
}
const rankDesc=a=>a.map(v=>1+a.filter(x=>x>v).length);

async function load(fresh){
  const t=$('tgl');let d=+t.value;
  try{
    let p;
    if(t.dataset.auto==='1'){for(let k=d;k>=1;k--){try{p=await fetchDay(k,true);if(p.any){d=k;break}}catch(e){if(k==d)throw e}}t.value=d;t.dataset.auto='0'}
    else p=await fetchDay(d,true);
    DATA={d,p};$('dot').className='dot';
    $('upd').textContent='Live · '+new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB';
    render();
  }catch(e){
    $('dot').className='dot e';$('upd').textContent='Gagal memuat';$('msg').style.display='block';$('cap').style.display='none';
    $('msg').innerHTML='⚠ Gagal membaca data ('+e.message+').<br>Pastikan Google Sheet dibagikan <b>"Anyone with the link – Viewer"</b> dan nama sheet <b>Tgl_01 … Tgl_31</b>.'}
}
function refresh(){MONTH=null;CACHE={};TAB==='acc'?loadMonth():load()}
function show(h){$('cap').innerHTML=h;$('cap').style.display='block';$('msg').style.display='none'}
function render(){if(!DATA&&TAB!=='acc')return;({prod:rProd,mem:rMem,acc:rAcc})[TAB]()}

/* ============ TAB 1: PRODUKTIVITAS ============ */
function rProd(){
  const jam=+$('jam').value,d=DATA.d,rows=agg(DATA.p,jam);
  const rk=IND.map(x=>rankDesc(rows.map(o=>o[x[0]])));
  rows.forEach((o,i)=>o.score=rk.reduce((a,r)=>a+r[i],0));
  const rr=rankDesc(rows.map(o=>-o.score));rows.forEach((o,i)=>o.rank=rr[i]);
  rows.sort((a,b)=>b.total-a.total);
  const n=rows.length||1,avg={};IND.forEach(x=>avg[x[0]]=rows.reduce((a,o)=>a+o[x[0]],0)/n);
  const avgT=rows.reduce((a,o)=>a+o.total,0)/n,mn={},mxk={};
  IND.forEach(x=>{const v=rows.map(o=>o[x[0]]);const lo=Math.min(...v),hi=Math.max(...v);mn[x[0]]=lo<hi?lo:null;
    const sh=v.map(a=>Math.max(0,TARGET[x[0]]-a));const sm=Math.max(...sh);mxk[x[0]]=(sm>0&&sm>Math.min(...sh))?sm:null});
  const cnt=[0,0,0,0],stat=t=>{const p=t/TOTAL_T;for(let i=0;i<4;i++)if(p>=STATUS[i][0]||i==3)return i};
  const jl=jam===-1?'TOTAL HARIAN':'JAM '+JAMS[jam];
  let h=`<div class="top"><div class="card c"><b>${rows.length} TOKO</b><div class="sm">RATA-RATA TOTAL</div><div class="big">${avgT.toFixed(2)}</div></div>
  <div class="card c"><h1>REKAP PRODUKTIVITAS TOKO AREA HASAN</h1><span class="pill">URUTAN TERTINGGI → TERENDAH · TANGGAL ${pad(d)} · ${jl}</span>
  <div class="sm" style="margin-top:8px">Kotak merah = nilai TERKECIL di kolom • Merah tua = KEKURANGAN TERBANYAK di kolom</div></div>
  <div class="card leg"><b>KETERANGAN STATUS</b><div><i style="background:#34d399"></i>SANGAT PRODUKTIF (≥90%)</div><div><i style="background:#60a5fa"></i>PRODUKTIF (≥70%)</div><div><i style="background:#fbbf24"></i>KURANG PRODUKTIF (≥50%)</div><div><i style="background:#fb7185"></i>TIDAK PRODUKTIF</div></div></div><div class="kpis k6">`;
  IND.forEach(x=>{const a=avg[x[0]],pc=Math.min(100,a/TARGET[x[0]]*100);
    h+=`<div class="card kpi"><h4>${x[1]}</h4><div class="v">${f1(a)}<span class="sm">/${TARGET[x[0]]}</span></div><div class="sm">RATA-RATA · ${pc.toFixed(0)}%</div><div class="bg"><span style="width:${pc}%"></span></div></div>`});
  h+=`<div class="card kpi" style="background:linear-gradient(135deg,var(--vi),var(--pk))"><h4 style="color:#fff">TOTAL</h4><div class="v">${f1(avgT)}</div><div class="sm" style="color:#fff">${(avgT/TOTAL_T*100).toFixed(0)}% DARI TARGET</div></div></div>
  <div class="tw"><table><thead><tr><th>No</th><th style="text-align:left">Kode / Nama</th><th>Personil</th><th>Rank</th>${IND.map(x=>`<th>${x[1]}<br>Act/Target/%</th>`).join('')}<th>Total</th><th>Status</th><th class="k" colspan="5">Kekurangan dari target (PSM · SERTIS · PWP · SEGER · CEBAN)</th></tr></thead><tbody>`;
  rows.forEach((o,i)=>{const si=stat(o.total);cnt[si]++;const tr=TIER.find(t=>i<t[0]);
    h+=`<tr><td class="no">${i+1}</td><td class="l nm"><b>${o.nama}</b><div>${o.kode}</div></td>
    <td class="ps"><span class="t" style="background:${tr[2]}"></span>${tr[1]}${o.staff||o.crew?`<br>${o.staff||'-'} / ${o.crew||'-'}`:''}</td><td class="rk">#${o.rank}</td>`;
    IND.forEach(x=>{const v=o[x[0]],t=TARGET[x[0]],ac=v/t*100,m=mn[x[0]]===v;
      h+=`<td><div class="v1 ${ac>=100?'ok':''} ${m?'min':''}">${f1(v)}/${t}<small>${ac.toFixed(0)}%${m?' · TERKECIL':''}</small></div></td>`});
    h+=`<td class="tt">${o.total.toFixed(1)}</td><td><span class="st ${STATUS[si][2]}">${STATUS[si][1]}</span></td>`;
    IND.forEach(x=>{const k=Math.max(0,TARGET[x[0]]-o[x[0]]),mx=mxk[x[0]]!==null&&k===mxk[x[0]];
      h+=`<td><div class="kr ${k==0?'z':''} ${mx?'mx':''}">${k==0?'0':f1(k)+' '+x[2]}${mx?'<small>TERBANYAK</small>':''}</div></td>`});
    h+='</tr>'});
  const pct=IND.map(x=>[x[1],avg[x[0]]/TARGET[x[0]]]).sort((a,b)=>a[1]-b[1]),good=cnt[0]+cnt[1];
  h+=`</tbody></table></div><div class="bot"><div class="card"><h3>🎯 TARGET</h3>${IND.map(x=>`<p>${x[1]} : ${TARGET[x[0]]}</p>`).join('')}</div>
  <div class="card"><h3>📊 RINGKASAN STATUS</h3><p>SANGAT PRODUKTIF : ${cnt[0]} Toko</p><p>PRODUKTIF : ${cnt[1]} Toko</p><p>KURANG PRODUKTIF : ${cnt[2]} Toko</p><p>TIDAK PRODUKTIF : ${cnt[3]} Toko</p></div>
  <div class="card kes"><h3>📝 KESIMPULAN</h3><p>${good===0?'Belum ada toko':'Hanya '+good+' toko'} berstatus PRODUKTIF/SANGAT PRODUKTIF dari ${rows.length} toko. Rata-rata total ${f1(avgT)} (${(avgT/TOTAL_T*100).toFixed(0)}% target). Fokus perbaikan: <b>${pct[0][0]}</b> (${(pct[0][1]*100).toFixed(0)}%) lalu <b>${pct[1][0]}</b> (${(pct[1][1]*100).toFixed(0)}%).</p></div></div>${foot()}`;
  show(h);
}
const foot=()=>`<div class="ft">Dibuat otomatis dari Dashboard Realtime Area Hasan · ${new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})} WIB</div>`;

/* ============ TAB 2: MEMBER & FAIR ============ */
function rMem(){
  const jam=+$('jam').value,d=DATA.d,rows=agg(DATA.p,jam);
  const IN=[['m','MEMBER','gm','pakai','tidak','Pakai','Tidak'],...FAIRS.map(f=>[f[0],f[1],f[2],f[0]+'R',f[0]+'L','Redeem','Lost'])];
  rows.forEach(o=>IN.forEach(x=>{const a=o[x[3]],b=o[x[4]];o[x[0]+'p']=a+b?a/(a+b):0;o[x[0]+'k']=o[x[0]+'p']+a*1e-6}));
  IN.forEach(x=>{const r=rankDesc(rows.map(o=>o[x[0]+'k']));rows.forEach((o,i)=>o[x[0]+'r']=r[i])});
  rows.forEach(o=>o.skor=IN.reduce((a,x)=>a+o[x[0]+'r'],0));
  rows.sort((a,b)=>a.skor-b.skor||b.mk-a.mk);
  const tot={};IN.forEach(x=>{const a=rows.reduce((s,o)=>s+o[x[3]],0),b=rows.reduce((s,o)=>s+o[x[4]],0);tot[x[0]]=[a,b,a+b?a/(a+b):0]});
  const jl=jam===-1?'TOTAL HARIAN':'JAM '+JAMS[jam];
  let h=`<div class="card c" style="margin-bottom:12px"><h1>REKAP MEMBER &amp; FAIR AREA HASAN</h1><span class="pill">TANGGAL ${pad(d)} · ${jl}</span></div><div class="kpis k4">`;
  IN.forEach(x=>h+=`<div class="grad ${x[2]}"><div class="sm"><b>${x[1]}</b></div><div class="v">${(tot[x[0]][2]*100).toFixed(1)}%</div><div class="sm">${tot[x[0]][0]} ${x[5]} / ${tot[x[0]][1]} ${x[6]}</div></div>`);
  h+=`</div><div class="tw"><table style="min-width:900px"><thead><tr><th>Rank</th><th style="text-align:left">Kode / Nama Toko</th>${IN.map(x=>`<th>${x[1]}<br>${x[5]}/${x[6]}</th>`).join('')}<th>Skor</th></tr></thead><tbody>`;
  rows.forEach((o,i)=>{h+=`<tr><td class="no">${i+1}</td><td class="l nm"><b>${o.nama}</b><div>${o.kode}</div></td>`;
    IN.forEach(x=>{const p=o[x[0]+'p'];const col=p>=.5?'var(--g)':'var(--r)';
      h+=`<td><div class="pc" style="color:${col}">${(p*100).toFixed(0)}%<small>${o[x[3]]}/${o[x[4]]} · R#${o[x[0]+'r']}</small></div></td>`});
    h+=`<td class="tt">${o.skor}</td></tr>`});
  h+=`</tbody></table></div><div class="sec" style="margin-top:14px;color:var(--r)">▼ 5 Toko Terbawah per Indikator</div><div class="b5">`;
  IN.forEach(x=>{const b=rows.slice().sort((a,c)=>a[x[0]+'k']-c[x[0]+'k']).slice(0,5);
    h+=`<div class="card"><span class="tag ${x[2]}">5 TERBAWAH · ${x[1]}</span>${b.map((o,i)=>`<div class="row"><span><b style="color:var(--r)">${i+1}.</b> ${o.nama}</span><b>${(o[x[0]+'p']*100).toFixed(0)}%</b></div>`).join('')}</div>`});
  show(h+`</div>${foot()}`);
}

/* ============ TAB 3: AKUMULASI BULAN ============ */
async function loadMonth(){
  $('msg').style.display='block';$('cap').style.display='none';$('msg').textContent='Mengambil data Tgl 1–31…';
  const days=await Promise.all(Array.from({length:31},(_,i)=>fetchDay(i+1).catch(()=>null)));
  const st={};
  days.forEach((p,di)=>{if(!p||!p.any)return;const rows=agg(p,-1);const r=rankDesc(rows.map(o=>o.total));
    rows.forEach((o,i)=>{const s=st[o.kode]=st[o.kode]||{nama:o.nama,kode:o.kode,tot:0,poin:0,hist:Array(31).fill(null),ind:{}};
      s.tot+=o.total;s.poin+=r[i];s.hist[di]=r[i];IND.forEach(x=>s.ind[x[0]]=(s.ind[x[0]]||0)+o[x[0]])})});
  MONTH=Object.values(st).sort((a,b)=>b.poin-a.poin);
  $('dot').className='dot';$('upd').textContent='Live · '+new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB';
  rAcc();
}
function rAcc(){
  if(!MONTH){loadMonth();return}
  const nd=MONTH.length?MONTH[0].hist.filter(x=>x!==null).length:0,n=MONTH.length;
  let h=`<div class="card c" style="margin-bottom:12px"><h1>AKUMULASI RANK PRODUKTIVITAS BULANAN</h1><span class="pill">${nd} HARI BERDATA · URUT: PALING SERING TERBAWAH</span>
  <div class="sm" style="margin-top:8px">Rank harian = urutan total (PSM+SERTIS+PWP+SEGER+CEBAN, total harian). Poin besar = sering di bawah. Hijau = rank 1–5 • Merah = rank 15 ke bawah</div></div>
  <div class="tw"><table style="min-width:1100px"><thead><tr><th>Posisi</th><th style="text-align:left">Kode / Nama</th><th>Total Bulan</th><th>Poin Rank</th><th style="text-align:left">Riwayat Rank Harian (Tgl 1–31)</th></tr></thead><tbody>`;
  MONTH.forEach((s,i)=>{h+=`<tr><td class="no">${i+1}</td><td class="l nm"><b>${s.nama}</b><div>${s.kode}</div></td><td class="tt">${f1(s.tot)}</td><td class="rk" style="font-size:16px">${s.poin}</td><td><div class="hist">`+
    s.hist.map((r,d)=>r===null?`<span class="hb n" title="Tgl ${d+1}">·</span>`:`<span class="hb" title="Tgl ${d+1}: Rank ${r}" style="background:${r<=5?'#34d399':r>=Math.max(15,n-4)?'#fb7185':'#fbbf24'}">${r}</span>`).join('')+`</div></td></tr>`});
  show(h+`</tbody></table></div>${foot()}`);
}

/* ============ DOWNLOAD ============ */
async function dl(){
  const el=$('cap');if(el.style.display==='none')return;
  const c=await html2canvas(el,{scale:2,backgroundColor:'#0b1220',useCORS:true,windowWidth:Math.max(el.scrollWidth,1500)});
  const a=document.createElement('a'),j=+$('jam').value;
  const nm={prod:'Rekap_Produktivitas',mem:'Rekap_Member_Fair',acc:'Akumulasi_Bulanan'}[TAB];
  a.download=TAB==='acc'?nm+'.png':`${nm}_Tgl${pad(DATA.d)}_${j===-1?'TotalHarian':'Jam'+JAMS[j].replace(':','')}.png`;
  a.href=c.toDataURL('image/png');a.click();
}
load();setInterval(()=>{if(TAB!=='acc')load()},REFRESH_DETIK*1000);
</script>
